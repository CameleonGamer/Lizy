name: Build Android APK (Beta)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Android architectures to compile (default: arm64-v8a,armeabi-v7a)'
        required: false
        default: 'arm64-v8a,armeabi-v7a'
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: 🛠️ Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Configure signing
        run: |
          sed -i \
            's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' \
            android/app/build.gradle || true

      - name: ⚡ Configure Gradle & Speed Optimizations
        working-directory: android
        run: |
          ARCHS="${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}"
          echo "Compiling target architectures: $ARCHS"

          # 1. Allocate 4GB RAM to Gradle with parallel GC to prevent GC pauses
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m/g' gradle.properties

          # 2. Restrict C++ CMake compilation to real physical phones (drops x86/x86_64 emulator bloat)
          sed -i "s/reactNativeArchitectures=.*/reactNativeArchitectures=$ARCHS/g" gradle.properties

          # 3. Disable R8 minification for fast beta builds
          sed -i 's/android.enableMinifyInReleaseBuilds=true/android.enableMinifyInReleaseBuilds=false/g' gradle.properties

          # 4. Disable slow AAPT2 PNG re-crunching
          sed -i 's/android.enablePngCrunchInReleaseBuilds=true/android.enablePngCrunchInReleaseBuilds=false/g' gradle.properties

          # 5. Enable Gradle caching & parallel execution
          cat >> gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          EOF

      - name: 🐘 Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: 🔨 Build optimized APK
        working-directory: android
        run: |
          ARCHS="${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}"
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=$ARCHS \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -x lint \
            -x lintVitalRelease \
            --build-cache \
            --parallel \
            --no-daemon

      - name: 📋 Prepare APK
        run: |
          mkdir -p build-output

          APK_PATH=$(find android/app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK_PATH" build-output/Lizy-Beta.apk
          ls -lh build-output/Lizy-Beta.apk

      - name: 🚀 Publish Beta Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Lizy ${{ github.ref_name }} (Android APK)"
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 📱 Lizy - Android Beta

            Version standalone Android compilée depuis le code source.

            ### Installation
            1. Téléchargez Lizy-Beta.apk.
            2. Ouvrez le fichier sur Android.
            3. Autorisez l'installation si nécessaire.
            4. Lancez Lizy !

          files: build-output/Lizy-Beta.apk

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lizy-Beta-APK
          path: build-output/Lizy-Beta.apk
          compression-level: 0
          retention-days: 14
