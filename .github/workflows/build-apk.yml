name: Build Android APK (Beta)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline

      - name: 🛠️ Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Configure signing
        run: |
          sed -i \
            's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' \
            android/app/build.gradle || true

      - name: 🐘 Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: ⚡ Configure Gradle
        working-directory: android
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.daemon=true
          org.gradle.configureondemand=true
          EOF

      - name: 🔨 Build optimized APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --build-cache \
            --parallel \
            --daemon \
            --max-workers=2

      - name: 📋 Prepare APK
        run: |
          mkdir -p build-output

          APK_PATH=$(find android/app/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK_PATH" build-output/Lizy-Beta.apk
          ls -lh build-output/Lizy-Beta.apk

      - name: 🚀 Publish Beta Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Lizy ${{ github.ref_name }} (Android APK)"
          tag_name: ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 📱 Lizy - Android Beta

            Version standalone Android compilée depuis le code source.

            ### Installation
            1. Téléchargez Lizy-Beta.apk.
            2. Ouvrez le fichier sur Android.
            3. Autorisez l'installation si nécessaire.
            4. Lancez Lizy !

          files: build-output/Lizy-Beta.apk

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lizy-Beta-APK
          path: build-output/Lizy-Beta.apk
          compression-level: 0
          retention-days: 14